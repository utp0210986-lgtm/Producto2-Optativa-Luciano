{% extends "base.html" %}
{% block title %}{{ "Editar" if restaurant else "Nuevo" }} restaurante · Sabores{% endblock %}
{% block content %}
<h1>{{ "Editar" if restaurant else "Nuevo" }} restaurante</h1>
<p class="sub">Todos los campos son obligatorios, excepto la foto.</p>

<form id="restaurant-form" {% if restaurant %}data-id="{{ restaurant.id }}"{% endif %}>
  <div class="field">
    <label>Nombre</label>
    <input name="name" required maxlength="100" value="{{ restaurant.name if restaurant else '' }}">
  </div>
  <div class="field">
    <label>Precio</label>
    <select name="price" required>
      {% for p in [1, 2, 3] %}
      <option value="{{ p }}" {{ 'selected' if restaurant and restaurant.price == p }}>{{ '$' * p }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Categoría</label>
    <input name="category" required maxlength="50" value="{{ restaurant.category if restaurant else '' }}">
  </div>
  <div class="field">
    <label>Ciudad</label>
    <input name="city" required maxlength="50" value="{{ restaurant.city if restaurant else '' }}">
  </div>
  <div class="field full">
    <label>URL de imagen</label>
    <input name="photoUrl" value="{{ (restaurant.photoUrl or '') if restaurant else '' }}">
  </div>
  <div class="form-actions">
    <button type="submit">Guardar</button>
    <a class="back" href="/">Cancelar</a>
  </div>
</form>
<p id="message" role="status"></p>
{% endblock %}
